---
layout: default
---
<!-- page.html -->
        {%- if page.formula_bg %}{% include formula_bg.html set=page.formula_bg %}{% endif %}
        <div class="post page-shell page-{{ page.title | slugify }}">

          <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="post-description">{{ page.description }}</p>
          </header>

          <article>
            {{ content }}
          </article>

        </div>
